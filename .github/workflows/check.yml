name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          for tool in jq ripgrep; do
            brew list "$tool" >/dev/null 2>&1 || brew install "$tool"
          done
      - name: Check
        run: make check
